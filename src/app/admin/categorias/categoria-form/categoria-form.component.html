<div class="p-grid p-justify-center">
  <div class="p-col-12 p-md-8 p-lg-6">
    <p-card [header]="isEditMode ? 'Editar Categoría' : 'Nueva Categoría'">
      <form [formGroup]="categoriaForm" (ngSubmit)="onSubmit()">
        <div class="p-fluid">
          <!-- Nombre -->
          <div class="p-field p-mb-4">
            <label for="nombre">Nombre *</label>
            <input
              id="nombre"
              type="text"
              pInputText
              formControlName="nombre"
              placeholder="Ingrese el nombre de la categoría"
              [class.ng-invalid]="isFieldInvalid('nombre')"
            />
            <small class="p-error" *ngIf="isFieldInvalid('nombre')">
              {{ getFieldError("nombre") }}
            </small>
          </div>

          <!-- Buttons -->
          <div class="p-field p-text-center">
            <p-button
              type="button"
              icon="pi pi-arrow-left"
              label="Cancelar"
              severity="secondary"
              (click)="navigateBack()"
              class="p-mr-2"
              [disabled]="loading"
            ></p-button>
            <p-button
              type="submit"
              [icon]="isEditMode ? 'pi pi-check' : 'pi pi-plus'"
              [label]="isEditMode ? 'Actualizar' : 'Crear'"
              [disabled]="loading"
              [loading]="loading"
            ></p-button>
          </div>
        </div>
      </form>
    </p-card>
  </div>
</div>

<!-- Toast Messages -->
<p-toast></p-toast>
