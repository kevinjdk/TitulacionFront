<div class="p-grid p-justify-center">
  <div class="p-col-12">
    <p-card header="Gestión de Categorías">
      <!-- Toolbar -->
      <p-toolbar>
        <ng-template pTemplate="left">
          <p-button
            icon="pi pi-arrow-left"
            label="Volver"
            severity="secondary"
            (click)="navigateBack()"
            class="p-mr-2"
          ></p-button>
          <p-button
            icon="pi pi-plus"
            label="Nueva Categoría"
            (click)="navigateToNew()"
          ></p-button>
        </ng-template>
      </p-toolbar>

      <!-- Table -->
      <p-table
        [value]="categorias"
        [loading]="loading"
        [paginator]="true"
        [rows]="10"
        [showCurrentPageReport]="true"
        currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} categorías"
        [rowsPerPageOptions]="[10, 25, 50]"
        styleClass="p-datatable-gridlines"
      >
        <ng-template pTemplate="header">
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Acciones</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-categoria>
          <tr>
            <td>{{ categoria.id }}</td>
            <td>{{ categoria.nombre }}</td>
            <td>
              <p-button
                icon="pi pi-pencil"
                label="Editar"
                severity="info"
                size="small"
                (click)="editCategoria(categoria)"
                class="p-mr-2"
              ></p-button>
              <p-button
                icon="pi pi-trash"
                label="Eliminar"
                severity="danger"
                size="small"
                (click)="confirmDelete(categoria)"
              ></p-button>
            </td>
          </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="3" class="p-text-center">
              No se encontraron categorías
            </td>
          </tr>
        </ng-template>
      </p-table>
    </p-card>
  </div>
</div>

<!-- Toast Messages -->
<p-toast></p-toast>

<!-- Confirmation Dialog -->
<p-confirmDialog></p-confirmDialog>
