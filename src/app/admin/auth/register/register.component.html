<div class="register-container">
  <div class="register-card">
    <div class="logo-container">
      <img src="assets/images/logo.png" alt="ReECetas Logo" class="logo" />
    </div>
    <div class="register-header">
      <h1>Crear Cuenta</h1>
      <p>Regístrate para acceder al sistema</p>
    </div>

    <form (ngSubmit)="register()" #registerForm="ngForm" class="register-form">
      <div class="form-group">
        <label for="username">Usuario *</label>
        <input
          id="username"
          type="text"
          pInputText
          [(ngModel)]="registerData.username"
          name="username"
          required
          placeholder="Ingrese su nombre de usuario"
          [disabled]="loading"
          autocomplete="username"
        />
      </div>

      <div class="form-group">
        <label for="email">Email *</label>
        <input
          id="email"
          type="email"
          pInputText
          [(ngModel)]="registerData.email"
          name="email"
          required
          placeholder="Ingrese su email"
          [disabled]="loading"
          autocomplete="email"
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña *</label>
        <p-password
          id="password"
          [(ngModel)]="registerData.password"
          name="password"
          [feedback]="true"
          placeholder="Ingrese su contraseña"
          [disabled]="loading"
          [style]="{ width: '100%' }"
          [inputStyle]="{ width: '100%' }"
          autocomplete="new-password"
        ></p-password>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmar Contraseña *</label>
        <p-password
          id="confirmPassword"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          [feedback]="false"
          placeholder="Confirme su contraseña"
          [disabled]="loading"
          [style]="{ width: '100%' }"
          [inputStyle]="{ width: '100%' }"
          autocomplete="new-password"
        ></p-password>
      </div>

      <div class="form-actions">
        <p-button
          type="submit"
          label="Registrarse"
          [loading]="loading"
          [disabled]="!registerForm.form.valid || loading"
          styleClass="register-btn"
        ></p-button>
      </div>
    </form>

    <div class="register-footer">
      <p>
        ¿Ya tienes una cuenta?
        <a (click)="navigateToLogin()" class="login-link">Inicia sesión aquí</a>
      </p>
    </div>
  </div>
</div>

<!-- Toast Messages -->
<p-toast></p-toast>
