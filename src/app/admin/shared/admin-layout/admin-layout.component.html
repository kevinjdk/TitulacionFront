<div class="admin-layout-container">
  <!-- Header -->
  <div class="header">
    <div class="logo">
      <img
        src="assets/images/logo.png"
        alt="ReECetas Logo"
        class="logo-image"
      />
      <span class="logo-text">Re<span class="highlight">EC</span>tas</span>

    </div>
    <div
      class="user-info"
      (click)="toggleUserMenu()"
      [class.active]="showUserMenu"
    >
      {{ username }}
      <i class="pi pi-user"></i>
      <i
        class="pi pi-chevron-down dropdown-arrow"
        [class.rotated]="showUserMenu"
      ></i>

      <!-- Dropdown Menu -->
      <div class="user-dropdown" [class.show]="showUserMenu">
        <div class="dropdown-item" (click)="logout(); $event.stopPropagation()">
          <i class="pi pi-sign-out"></i>
          Cerrar Sesión
        </div>
      </div>
    </div>
  </div>

  <!-- Main Layout -->
  <div class="main-layout">
    <!-- Sidebar -->
    <div class="sidebar">
      <nav>
        <ul class="nav-menu">
          <li
            class="nav-item"
            [class.active]="isActive('dashboard')"
            (click)="router.navigate(['/admin/dashboard'])"
          >
            <i class="pi pi-home"></i>
            INICIO
          </li>
          <li
            class="nav-item"
            [class.active]="isActive('regiones')"
            (click)="router.navigate(['/admin/regiones'])"
          >
            <i class="pi pi-map"></i>
            REGIÓN
          </li>
          <li
            class="nav-item"
            [class.active]="isActive('provincias')"
            (click)="router.navigate(['/admin/provincias'])"
          >
            <i class="pi pi-globe"></i>
            PROVINCIA
          </li>
          <li
            class="nav-item"
            [class.active]="isActive('categorias')"
            (click)="router.navigate(['/admin/categorias'])"
          >
            <i class="pi pi-tags"></i>
            CATEGORÍA
          </li>
          <li
            class="nav-item"
            [class.active]="isActive('platos')"
            (click)="router.navigate(['/admin/platos'])"
          >
            <i class="pi pi-shopping-cart"></i>
            PLATOS
          </li>
        </ul>
      </nav>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <div class="page-header" *ngIf="pageTitle">
        <h1>{{ pageTitle }}</h1>
        <p class="subtitle">Crud</p>
      </div>

      <!-- Content Projection -->
      <div class="content-area">
        <ng-content></ng-content>
      </div>

      <!-- Footer -->
      <div class="footer">
        <div class="footer-brand">ReECtas</div>
        <div class="social-icons">
          <i class="pi pi-facebook"></i>
          <i class="pi pi-instagram"></i>
          <i class="pi pi-github"></i>
        </div>
      </div>
    </div>
  </div>
</div>
