<app-admin-layout pageTitle="REGIÓN" currentRoute="regiones">
  <!-- Toolbar -->
  <p-toolbar styleClass="mb-3">
    <ng-template pTemplate="left">
      <p-button
        icon="pi pi-plus"
        label="Nuevo"
        severity="success"
        (click)="navigateToNew()"
        class="mr-2"
      ></p-button>
    </ng-template>
  </p-toolbar>

  <!-- Table -->
  <p-table
    [value]="regiones"
    [loading]="loading"
    [paginator]="true"
    [rows]="10"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
    [rowsPerPageOptions]="[10, 25, 50]"
    dataKey="id"
    styleClass="p-datatable-gridlines"
  >
    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="id">
          ID
          <p-sortIcon field="id"></p-sortIcon>
        </th>
        <th pSortableColumn="nombre">
          Nombre
          <p-sortIcon field="nombre"></p-sortIcon>
        </th>
        <th>Provincias</th>
        <th>Acciones</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-region>
      <tr>
        <td>{{ region.id }}</td>
        <td>{{ region.nombre }}</td>
        <td>
          <span *ngIf="region.provincias && region.provincias.length > 0">
            {{ region.provincias.length }} provincia(s)
          </span>
          <span *ngIf="!region.provincias || region.provincias.length === 0">
            Sin provincias
          </span>
        </td>
        <td>
          <p-button
            icon="pi pi-pencil"
            severity="info"
            size="small"
            (click)="editRegion(region)"
            class="mr-2"
            pTooltip="Editar"
          ></p-button>
          <p-button
            icon="pi pi-trash"
            severity="danger"
            size="small"
            (click)="confirmDelete(region)"
            pTooltip="Eliminar"
          ></p-button>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="4" class="text-center">No se encontraron regiones</td>
      </tr>
    </ng-template>
  </p-table>
</app-admin-layout>

<!-- Modal de Creación -->
<p-dialog
  header="Nueva Región"
  [(visible)]="showCreateDialog"
  [modal]="true"
  [style]="{ width: '450px' }"
  [closable]="true"
  [draggable]="false"
  [resizable]="false"
>
  <div class="p-fluid">
    <div class="p-field">
      <label for="newRegionNombre">Nombre de la Región</label>
      <input
        id="newRegionNombre"
        type="text"
        pInputText
        [(ngModel)]="newRegion.nombre"
        placeholder="Ingrese el nombre de la región"
        class="mt-2"
        [style]="{ width: '60%' }"
      />
    </div>
  </div>

  <ng-template pTemplate="footer">
    <div class="flex justify-content-end gap-2">
      <p-button
        icon="pi pi-times"
        label="Cancelar"
        severity="secondary"
        (click)="hideCreateDialog()"
        [outlined]="true"
      ></p-button>
      <p-button
        icon="pi pi-check"
        label="Crear"
        severity="success"
        (click)="createRegion()"
      ></p-button>
    </div>
  </ng-template>
</p-dialog>

<!-- Modal de Edición -->
<p-dialog
  header="Actualizar Región"
  [(visible)]="showEditDialog"
  [modal]="true"
  [style]="{ width: '450px' }"
  [closable]="true"
  [draggable]="false"
  [resizable]="false"
>
  <div class="p-fluid">
    <div class="p-field">
      <label for="regionNombre">Nombre de la Región</label>
      <input
        id="regionNombre"
        type="text"
        pInputText
        [(ngModel)]="selectedRegion.nombre"
        placeholder="Ingrese el nombre de la región"
        class="mt-2"
        [style]="{ width: '60%' }"
      />
    </div>
  </div>

  <ng-template pTemplate="footer">
    <div class="flex justify-content-end gap-2">
      <p-button
        icon="pi pi-times"
        label="Cancelar"
        severity="secondary"
        (click)="hideEditDialog()"
        [outlined]="true"
      ></p-button>
      <p-button
        icon="pi pi-check"
        label="Guardar"
        severity="success"
        (click)="saveRegion()"
      ></p-button>
    </div>
  </ng-template>
</p-dialog>

<!-- Toast Messages -->
<p-toast></p-toast>

<!-- Confirmation Dialog -->
<p-confirmDialog></p-confirmDialog>
