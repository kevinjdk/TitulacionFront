<div class="p-grid p-justify-center">
  <div class="p-col-12">
    <p-card header="Gestión de Provincias">
      <!-- Toolbar -->
      <p-toolbar>
        <ng-template pTemplate="left">
          <p-button
            icon="pi pi-arrow-left"
            label="Volver"
            severity="secondary"
            (click)="navigateBack()"
            class="p-mr-2"
          ></p-button>
          <p-button
            icon="pi pi-plus"
            label="Nueva Provincia"
            (click)="navigateToNew()"
          ></p-button>
        </ng-template>
      </p-toolbar>

      <!-- Table -->
      <p-table
        [value]="provincias"
        [loading]="loading"
        [paginator]="true"
        [rows]="15"
        [showCurrentPageReport]="true"
        currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} provincias"
        [rowsPerPageOptions]="[15, 25, 50]"
        styleClass="p-datatable-gridlines"
      >
        <ng-template pTemplate="header">
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Región</th>
            <th>Acciones</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-provincia>
          <tr>
            <td>{{ provincia.id }}</td>
            <td>{{ provincia.nombre }}</td>
            <td>
              <span *ngIf="provincia.region">
                {{ provincia.region.nombre }}
              </span>
              <span *ngIf="!provincia.region"> Sin región asignada </span>
            </td>
            <td>
              <p-button
                icon="pi pi-pencil"
                label="Editar"
                severity="info"
                size="small"
                (click)="editProvincia(provincia)"
                class="p-mr-2"
              ></p-button>
              <p-button
                icon="pi pi-trash"
                label="Eliminar"
                severity="danger"
                size="small"
                (click)="confirmDelete(provincia)"
              ></p-button>
            </td>
          </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="4" class="p-text-center">
              No se encontraron provincias
            </td>
          </tr>
        </ng-template>
      </p-table>
    </p-card>
  </div>
</div>

<!-- Toast Messages -->
<p-toast></p-toast>

<!-- Confirmation Dialog -->
<p-confirmDialog></p-confirmDialog>
