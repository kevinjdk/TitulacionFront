<div class="dashboard-container">
  <!-- Header -->
  <div class="header">
    <div class="logo">
      <img
        src="assets/images/logo.png"
        alt="ReECetas Logo"
        class="logo-image"
      />
      <span class="logo-text">Re<span class="highlight">EC</span>tas</span>

    </div>
    <div
      class="user-info"
      (click)="toggleUserMenu()"
      [class.active]="showUserMenu"
    >
      {{ username }}
      <i class="pi pi-user"></i>
      <i
        class="pi pi-chevron-down dropdown-arrow"
        [class.rotated]="showUserMenu"
      ></i>

      <!-- Dropdown Menu -->
      <div class="user-dropdown" [class.show]="showUserMenu">
        <div class="dropdown-item" (click)="logout(); $event.stopPropagation()">
          <i class="pi pi-sign-out"></i>
          Cerrar Sesión
        </div>
      </div>
    </div>
  </div>

  <!-- Main Layout -->
  <div class="main-layout">
    <!-- Sidebar -->
    <div class="sidebar">
      <nav>
        <ul class="nav-menu">
          <li class="nav-item active">
            <i class="pi pi-home"></i>
            INICIO
          </li>
          <li class="nav-item" (click)="router.navigate(['/admin/regiones'])">
            <i class="pi pi-map"></i>
            REGIÓN
          </li>
          <li class="nav-item" (click)="router.navigate(['/admin/provincias'])">
            <i class="pi pi-globe"></i>
            PROVINCIA
          </li>
          <li class="nav-item" (click)="router.navigate(['/admin/categorias'])">
            <i class="pi pi-tags"></i>
            CATEGORÍA
          </li>
          <li class="nav-item" (click)="router.navigate(['/admin/platos'])">
            <i class="pi pi-shopping-cart"></i>
            PLATOS
          </li>
        </ul>
      </nav>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <div class="welcome-section">
        <h1>BIENVENIDO USER</h1>
        <p class="subtitle">Dashboard</p>
      </div>

      <!-- Statistics Cards -->
      <div class="stats-grid" *ngIf="!loading">
        <div
          class="stat-card regiones"
          (click)="router.navigate(['/admin/regiones'])"
        >
          <h3>REGIONES</h3>
          <div class="count">{{ regionesCount }}</div>
        </div>

        <div
          class="stat-card provincias"
          (click)="router.navigate(['/admin/provincias'])"
        >
          <h3>PROVINCIAS</h3>
          <div class="count">{{ provinciasCount }}</div>
        </div>

        <div
          class="stat-card categorias"
          (click)="router.navigate(['/admin/categorias'])"
        >
          <h3>CATEGORÍAS</h3>
          <div class="count">{{ categoriasCount }}</div>
        </div>

        <div
          class="stat-card platos"
          (click)="router.navigate(['/admin/platos'])"
        >
          <h3>PLATOS</h3>
          <div class="count">{{ platosCount }}</div>
        </div>
      </div>

      <!-- Loading indicator -->
      <div class="loading-container" *ngIf="loading">
        <i class="pi pi-spin pi-spinner" style="font-size: 2rem"></i>
        <p>Cargando estadísticas...</p>
      </div>

      <!-- Footer -->
      <div class="footer">
        <div class="footer-brand">ReECtas</div>
        <div class="social-icons">
          <i class="pi pi-facebook"></i>
          <i class="pi pi-instagram"></i>
          <i class="pi pi-github"></i>
        </div>
      </div>
    </div>
  </div>
</div>
